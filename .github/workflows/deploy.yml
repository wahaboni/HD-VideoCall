name: Deploy ke VPS

on:
  push:
    branches: [master]
  workflow_dispatch: # memungkinkan deploy manual dari tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH ke VPS dan deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true # gagal langsung kalau ada perintah error
          script: |
            set -e
            cd /opt/hdvc
            git pull --ff-only
            bash deploy/update.sh
